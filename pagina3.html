<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestros Viajes</title>
  <style>
    :root {
      --sky-top: #050b24;
      --sky-mid: #101e46;
      --sky-bottom: #1f2d5e;
      --ground: #1b3d2e;
      --ground-deep: #10261f;
      --petal-1: #ff7eb5;
      --petal-2: #ffc2dc;
      --petal-3: #98d5ff;
      --stem-1: #59d88c;
      --stem-2: #218a5d;
      --leaf-1: #6fe38f;
      --leaf-2: #2d875d;
      --gold: #f7d76b;
      --card-glow: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1c2f63 0%, var(--sky-top) 28%, var(--sky-mid) 60%, var(--sky-bottom) 100%);
      color: #f4ecff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px;
    }

    .card {
      position: relative;
      width: min(920px, 100%);
      background: rgba(10, 14, 30, 0.52);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 30px;
      padding: 30px 22px 38px;
      box-shadow: 0 22px 54px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 35%, rgba(255,255,255,0.02));
      pointer-events: none;
    }

    .header {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      letter-spacing: 0.04em;
      color: #f8d8ff;
    }

    .header p {
      margin: 0 auto;
      max-width: 620px;
      color: rgba(255,255,255,0.78);
      line-height: 1.7;
      font-size: 1.02rem;
    }

    .nav {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      margin: 18px 0 26px;
    }

    .nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff7eb5, #8c7dff);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 12px 24px rgba(255, 126, 181, 0.25);
    }

    .scene {
      position: relative;
      height: 420px;
      margin-top: 12px;
      border-radius: 26px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(8, 16, 34, 0.08), rgba(8, 14, 25, 0.55));
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 1;
    }

    .stars,
    .stars::before,
    .stars::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 10% 18%, rgba(255,255,255,0.95), transparent 100%),
        radial-gradient(2px 2px at 28% 26%, rgba(255,255,255,0.9), transparent 100%),
        radial-gradient(1.5px 1.5px at 42% 12%, rgba(255,255,255,0.9), transparent 100%),
        radial-gradient(2px 2px at 58% 20%, rgba(255,255,255,0.95), transparent 100%),
        radial-gradient(1.5px 1.5px at 72% 14%, rgba(255,255,255,0.8), transparent 100%),
        radial-gradient(2px 2px at 86% 24%, rgba(255,255,255,0.8), transparent 100%),
        radial-gradient(2px 2px at 18% 44%, rgba(255,255,255,0.9), transparent 100%),
        radial-gradient(1.5px 1.5px at 52% 38%, rgba(255,255,255,0.8), transparent 100%),
        radial-gradient(2px 2px at 78% 42%, rgba(255,255,255,0.9), transparent 100%),
        radial-gradient(2px 2px at 92% 36%, rgba(255,255,255,0.8), transparent 100%);
      opacity: 0.9;
      animation: twinkle 5s ease-in-out infinite alternate;
    }

    .stars::before {
      transform: scale(1.2);
      opacity: 0.7;
      animation-delay: 1.2s;
    }

    .stars::after {
      transform: scale(1.4);
      opacity: 0.55;
      animation-delay: 2.4s;
    }

    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 110px;
      background: linear-gradient(180deg, var(--ground), var(--ground-deep));
      border-top: 3px solid rgba(130, 255, 192, 0.25);
    }

    .ground::before {
      content: "";
      position: absolute;
      inset: 20px 18px 0;
      background: radial-gradient(circle at 18% 0%, rgba(255,255,255,0.12), transparent 32%);
      opacity: 0.55;
    }

    .garden {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      gap: 22px;
      padding: 0 28px 34px 30px;
    }

    .tulip {
      --tilt: 0deg;
      position: relative;
      width: 84px;
      height: 220px;
      opacity: 0;
      transform: translateY(130px) rotate(18deg) scale(0.72);
      animation: growTulip 2.4s cubic-bezier(.18,.8,.18,1) forwards;
      animation-delay: calc(var(--i) * 0.42s);
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.2));
      isolation: isolate;
    }

    .tulip:nth-child(odd) { --tilt: -18deg; }
    .tulip:nth-child(even) { --tilt: 18deg; }

    .stem {
      position: absolute;
      left: 50%;
      bottom: 12px;
      width: 12px;
      height: 164px;
      transform: translateX(-50%) rotate(var(--tilt));
      background: linear-gradient(180deg, var(--stem-1), var(--stem-2));
      border-radius: 999px;
      box-shadow: inset -2px 0 0 rgba(255,255,255,0.12);
      z-index: 1;
    }

    .stem::before {
      content: "";
      position: absolute;
      inset: 10px 2px auto 2px;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0));
      opacity: 0.55;
    }

    .leaf {
      position: absolute;
      bottom: 92px;
      width: 42px;
      height: 70px;
      background: linear-gradient(135deg, var(--leaf-1), var(--leaf-2));
      border-radius: 100% 0 100% 0;
      box-shadow: inset -4px -4px 8px rgba(0,0,0,0.12);
      z-index: 2;
    }

    .leaf.left {
      left: 6px;
      transform: rotate(-28deg);
    }

    .leaf.right {
      right: 6px;
      transform: scaleX(-1) rotate(-28deg);
    }

    .leaf::after {
      content: "";
      position: absolute;
      inset: 12px 12px 14px 12px;
      border-left: 2px solid rgba(255,255,255,0.18);
      border-radius: 50%;
      transform: rotate(12deg);
    }

    .flower {
      position: absolute;
      left: 50%;
      bottom: 154px;
      width: 92px;
      height: 90px;
      transform: translateX(-50%) rotate(var(--tilt));
      animation: bloom 2.7s ease-out forwards;
      animation-delay: calc(var(--i) * 0.42s + 0.35s);
      z-index: 3;
    }

    .petal {
      position: absolute;
      width: 30px;
      height: 54px;
      border-radius: 65% 65% 42% 42%;
      background: linear-gradient(180deg, var(--petal-2), var(--petal-1));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2), inset -9px -10px 16px rgba(120, 32, 72, 0.15);
      transform-origin: center bottom;
      z-index: 2;
    }

    .petal.left {
      left: 14px;
      bottom: 12px;
      transform: rotate(-30deg);
    }

    .petal.right {
      right: 14px;
      bottom: 12px;
      transform: rotate(30deg);
    }

    .petal.back {
      left: 50%;
      bottom: 18px;
      width: 24px;
      height: 42px;
      transform: translateX(-50%) rotate(180deg);
      opacity: 0.9;
      background: linear-gradient(180deg, var(--petal-3), #d9f1ff);
      z-index: 1;
    }

    .petal.center {
      left: 50%;
      bottom: 14px;
      width: 38px;
      height: 60px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #ffe3f3, var(--petal-1));
      z-index: 3;
    }

    .flower::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 18px;
      height: 18px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, #ffe79d 0%, #f2c95d 45%, #d7932d 100%);
      box-shadow: 0 0 12px rgba(255, 221, 120, 0.8);
      z-index: 4;
    }

    .flower::after {
      content: "";
      position: absolute;
      inset: 18px 20px 14px 20px;
      background: radial-gradient(circle at center, rgba(255,255,255,0.55), transparent 60%);
      border-radius: 50%;
      filter: blur(3px);
      opacity: 0.7;
    }

    .starfall {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      animation: starBurst 1.5s ease-in-out 6s forwards;
    }

    .star {
      position: absolute;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle, #fff 0%, #ffe98d 45%, rgba(255,255,255,0) 70%);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255, 248, 179, 0.9);
      animation: fallStar linear infinite;
    }

    .star:nth-child(1) { left: 14%; top: 12%; animation-duration: 2.2s; animation-delay: 0.2s; }
    .star:nth-child(2) { left: 26%; top: 18%; animation-duration: 2.8s; animation-delay: 0.9s; }
    .star:nth-child(3) { left: 41%; top: 9%; animation-duration: 2.6s; animation-delay: 1.4s; }
    .star:nth-child(4) { left: 58%; top: 22%; animation-duration: 3s; animation-delay: 0.6s; }
    .star:nth-child(5) { left: 72%; top: 14%; animation-duration: 2.7s; animation-delay: 1.7s; }
    .star:nth-child(6) { left: 82%; top: 28%; animation-duration: 2.9s; animation-delay: 0.5s; }
    .star:nth-child(7) { left: 66%; top: 8%; animation-duration: 2.4s; animation-delay: 1.2s; }
    .star:nth-child(8) { left: 88%; top: 16%; animation-duration: 2.5s; animation-delay: 1.8s; }

    @keyframes growTulip {
      0% {
        opacity: 0;
        transform: translateY(130px) rotate(20deg) scale(0.72);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
      }
    }

    @keyframes bloom {
      0% {
        transform: translateX(-50%) scale(0.52) rotate(var(--tilt));
        opacity: 0;
      }
      70% {
        opacity: 1;
      }
      100% {
        transform: translateX(-50%) scale(1) rotate(var(--tilt));
        opacity: 1;
      }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes starBurst {
      0% { opacity: 0; }
      30% { opacity: 1; }
      100% { opacity: 1; }
    }

    @keyframes fallStar {
      0% {
        transform: translate(0, 0) scale(0.5);
        opacity: 0;
      }
      12% { opacity: 1; }
      100% {
        transform: translate(35px, 60px) scale(1.4);
        opacity: 0;
      }
    }

    @media (max-width: 700px) {
      .scene { height: 360px; }
      .garden { gap: 12px; padding-left: 10px; padding-right: 10px; }
      .tulip { width: 58px; height: 180px; }
      .flower { transform: translateX(-50%) scale(0.82) rotate(var(--tilt)); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Nuestros Viajes</h1>
      <p><strong>Hola Mi amada y querida Esposa te amo mucho</strong></p>
    </div>

    <div class="nav">
      <a href="index.html">Volver a la página principal</a>
    </div>

    <div class="scene" aria-label="Escena romántica con tulipanes y estrellas">
      <div class="stars"></div>

      <div class="garden" id="garden">
        <div class="tulip" style="--i: 1;">
          <div class="stem"></div>
          <div class="leaf left"></div>
          <div class="leaf right"></div>
          <div class="flower">

        </div>

        <div class="tulip" style="--i: 2;">

          <div class="leaf left"></div>
          <div class="leaf right"></div>
          <div class="flower">

            <span class="petal back"></span>
            <span class="petal center"></span>
            <span class="petal right"></span>
          </div>
        </div>

        <div class="tulip" style="--i: 3;">
          <div class="stem"></div>
          <div class="leaf left"></div>
          <div class="leaf right"></div>
          <div class="flower">
            <span class="petal left"></span>
            <span class="petal back"></span>
            <span class="petal center"></span>
            <span class="petal right"></span>
          </div>
        </div>

        <div class="tulip" style="--i: 4;">
          <div class="stem"></div>
          <div class="leaf left"></div>
          <div class="leaf right"></div>
          <div class="flower">
            <span class="petal left"></span>
            <span class="petal back"></span>
            <span class="petal center"></span>
            <span class="petal right"></span>
          </div>
        </div>

        <div class="tulip" style="--i: 5;">
          <div class="stem"></div>
          <div class="leaf left"></div>
          <div class="leaf right"></div>
          <div class="flower">
            <span class="petal left"></span>
            <span class="petal back"></span>
            <span class="petal center"></span>
            <span class="petal right"></span>
          </div>
        </div>

        <div class="tulip" style="--i: 6;">
          <div class="stem"></div>
          <div class="leaf left"></div>
          <div class="leaf right"></div>
          <div class="flower">
            <span class="petal left"></span>
            <span class="petal back"></span>
            <span class="petal center"></span>

          </div>
        </div>
      </div>

      <div class="ground"></div>

      <div class="starfall" aria-hidden="true">

        <span class="star"></span>
        <span class="star"></span>

        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
      </div>
    </div>

    <div class="gallery" id="gallery" style="position:relative; z-index:2; margin-top:24px;"></div>
  </div>

  <script>
    const images = [
      'fotos/im.jpeg',
      'fotos/jk.jpeg',
      'fotos/WhatsApp Image 2026-07-13 at 7.25.09 PM.jpeg',
      'fotos/WhatsApp Image 2026-07-13 at 7.25.10 PM.jpeg',
      'fotos/WhatsApp Image 2026-07-13 at 7.25.18 PM.jpeg',
      'fotos/WhatsApp Image 2026-07-13 at 7.25.21 PM.jpeg',
      'fotos/WhatsApp Image 2026-07-13 at 7.25.22 PM.jpeg'
    ];
    const gallery = document.getElementById('gallery');
    images.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = 'Foto romántica';
      gallery.appendChild(img);
    });
  </script>
  
</body>
</html>
